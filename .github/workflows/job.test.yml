# TODO: remove this line which appeases integrity.py
#
#   jupyterlab >=4.1.0,<5.0.0a0
#
name: CI

on:
  push:
    branches:
      - main
      - 4.x
  pull_request:
    branches:
      - main
      - 4.x
  workflow_dispatch:

# TODO: might need to tweak `group`
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  # pixi
  PIXI_COLOR: always
  # python
  PYTHONUNBUFFERED: 1
  # julia
  JULIA_NUM_THREADS: 2
  # this repo
  ## increase this value to reset all caches
  CACHE_EPOCH: 8
  ## TODO: keep in sync with `pixi.toml#/$schema`
  PIXI_VERSION: 0.44.0
  ## add `-v` to see more inputs/outputs
  PIXI_RUN: pixi run --no-install --locked

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache pixi env
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          environments: build
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            !node_modules/.cache/
            **/node_modules/
          key: |
            ${{ env.CACHE_EPOCH }}-node-${{ hashFiles('pixi.lock', 'yarn.lock') }}
      - name: Install nodejs dependencies
        run: ${{ env.PIXI_RUN }} setup-js && touch node_modules/.ci-skip-yarn
      - name: Build all intermediates
        run: ${{ env.PIXI_RUN }} build
      - name: Build all distributions
        run: ${{ env.PIXI_RUN }} dist
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: jplsp-${{ github.run_number }}-dist
          path: |
            .pixi/task-cache-v0/
            dist/
            yarn.lock

  win-prep:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache pixi env
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          environments: build
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            !node_modules/.cache/
            **/node_modules/
          key: |
            ${{ env.CACHE_EPOCH }}-node-${{ hashFiles('pixi.lock', 'yarn.lock') }}
      - name: Install nodejs dependencies
        run: ${{ env.PIXI_RUN }} setup-js && echo "" > node_modules/.ci-skip-yarn

  lint:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache pixi env
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          environments: lint
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            !node_modules/.cache/
            **/node_modules/
          key: |
            ${{ env.CACHE_EPOCH }}-node-${{ hashFiles('pixi.lock', 'yarn.lock') }}
      - name: Apply source formatting
        run: ${{ env.PIXI_RUN }} fix
      - name: Run source checks
        run: ${{ env.PIXI_RUN }} lint
      - name: Report changed files
        if: always()
        run: ${{ env.PIXI_RUN }} ci-summary-diff >> "${GITHUB_STEP_SUMMARY}"

  docs:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache pixi env
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          environments: docs
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            !node_modules/.cache/
            **/node_modules/
          key: |
            ${{ env.CACHE_EPOCH }}-node-${{ hashFiles('pixi.lock', 'yarn.lock') }}
      - run: ${{ env.PIXI_RUN }} docs
      - uses: actions/upload-artifact@v4
        with:
          name: jplsp-${{ github.run_number }}-docs
          path: |
            build/docs

  itest:
    needs: [build, win-prep]
    runs-on: ${{ matrix.os }}-${{ matrix.vm }}
    strategy:
      fail-fast: false
      matrix:
        epoch: [min, now]
        os: [macos, ubuntu, windows]
        vm: [latest]
        include:
          - { epoch: min, os: macos, vm: 13 }
        exclude:
          - { epoch: min, os: macos, vm: latest }
    steps:
      - uses: actions/checkout@v4
      - name: Cache pixi env
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          environments: itest-${{ matrix.epoch }}
      - name: Download PyPI distributions
        uses: actions/download-artifact@v4
        with:
          name: jplsp-${{ github.run_number }}-dist
      # cache
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            !node_modules/.cache/
            **/node_modules/
          key: |
            ${{ env.CACHE_EPOCH }}-node-${{ hashFiles('pixi.lock', 'yarn.lock') }}
      # setup
      - name: Cache julia language server packages
        uses: actions/cache@v4
        with:
          path: |
            .pixi/envs/itest-${{ matrix.epoch }}/share/julia
          key: |
            ${{ env.CACHE_EPOCH }}-julia-itest-${{ matrix.epoch }}-${{ matrix.os }}-${{ hashFiles('pixi.lock') }}
      - if: matrix.epoch == 'now'
        name: |
          Set up julia for integration test (epoch: ${{ matrix.epoch }})
        run: ${{ env.PIXI_RUN }} --skip-deps itest-${{ matrix.epoch }}-setup-julia
      - name: |-
          Install PyPI distributions for integration testing (epoch: ${{ matrix.epoch }})
        run: ${{ env.PIXI_RUN }} --skip-deps itest-${{ matrix.epoch }}-uv
      # itest
      - name: |
          Run integration tests (epoch: ${{ matrix.epoch }})
        run: ${{ env.PIXI_RUN }} --skip-deps itest-${{ matrix.epoch }}
      # reporting
      - if: always()
        name: Publish browser test output
        uses: actions/upload-artifact@v4
        with:
          name: |-
            jplsp-${{ github.run_number }}-itest-${{ matrix.epoch }}-${{ matrix.os }}-${{ matrix.vm }}
          path: ./build/reports

  atest:
    needs: [build, win-prep]
    runs-on: ${{ matrix.os }}-${{ matrix.vm }}
    strategy:
      fail-fast: false
      matrix:
        epoch: [min, now]
        os: [macos, ubuntu, windows]
        vm: [latest]
        include:
          - { epoch: min, os: macos, vm: 13 }
          - { epoch: pre, os: ubuntu, vm: latest }
        exclude:
          - { epoch: min, os: macos, vm: latest }
    steps:
      - uses: actions/checkout@v4
      - name: Cache pixi env
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v${{ env.PIXI_VERSION }}
          cache: true
          environments: atest-${{ matrix.epoch }}
      - name: Download PyPI distributions
        uses: actions/download-artifact@v4
        with:
          name: jplsp-${{ github.run_number }}-dist
      # caches
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            !node_modules/.cache/
            **/node_modules/
          key: |
            ${{ env.CACHE_EPOCH }}-node-${{ hashFiles('pixi.lock', 'yarn.lock') }}
      - name: Cache julia language server packages
        uses: actions/cache@v4
        with:
          path: |
            .pixi/envs/atest-${{ matrix.epoch }}/share/julia
          key: |
            ${{ env.CACHE_EPOCH }}-atest-julia-${{ matrix.epoch }}-${{ matrix.os }}-${{ hashFiles('pixi.lock') }}
      - name: Cache tex packages
        uses: actions/cache@v4
        with:
          path: |
            build/.cache/tectonic
          key: |
            ${{ env.CACHE_EPOCH }}-tex-${{ matrix.epoch }}-${{ matrix.os }}-${{ hashFiles('pixi.lock', 'atest/_examples/example.tex') }}
      # preflight, separated for log clarity
      - if: matrix.epoch != 'min'
        name: |
          Set up julia for acceptance test (epoch: ${{ matrix.epoch }})
        run: ${{ env.PIXI_RUN }} --skip-deps atest-${{ matrix.epoch }}-setup-julia
      - if: matrix.epoch != 'min'
        name: |
          Set up tex for acceptance test (epoch: ${{ matrix.epoch }})
        run: ${{ env.PIXI_RUN }} --skip-deps --environment atest-${{ matrix.epoch }} tectonic-cache--
      - name: |-
          Install PyPI distributions for acceptance testing (epoch: ${{ matrix.epoch }})
        run: ${{ env.PIXI_RUN }} --skip-deps atest-${{ matrix.epoch }}-uv
      # atest
      - name: |-
          Run acceptance tests until first failure, ignore failure (epoch: ${{ matrix.epoch }})
        continue-on-error: true
        env:
          ROBOT_OPTIONS: --exitonfailure
        run: ${{ env.PIXI_RUN }} --skip-deps atest-${{ matrix.epoch }}
      - name: |-
          Rerun any failed acceptance tests, ignore failure (epoch: ${{ matrix.epoch }})
        continue-on-error: true
        env:
          ATEST_ATTEMPT: 1
          ATEST_RETRIES: 1
        run: ${{ env.PIXI_RUN }} --skip-deps atest-${{ matrix.epoch }}
      - name: |-
          Re-rerun any failed acceptance tests (epoch: ${{ matrix.epoch }})
        env:
          ATEST_ATTEMPT: 2
          ATEST_RETRIES: 3
        run: ${{ env.PIXI_RUN }} --skip-deps atest-${{ matrix.epoch }}
      # reporting
      - if: always()
        name: Summarize acceptance test results
        run: ${{ env.PIXI_RUN }} -e atest-${{ matrix.epoch }} ci-summary-atest
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: |-
            jplsp-${{ github.run_number }}-atest-${{ matrix.epoch }}-${{ matrix.os }}-${{ matrix.vm }}
          path: ./build/reports
